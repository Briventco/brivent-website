services:
  - type: web
    name: brivent-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FIREBASE_PROJECT_ID
        value: brivent-website
      - key: FIREBASE_STORAGE_BUCKET
        value: brivent-website.firebasestorage.app
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false